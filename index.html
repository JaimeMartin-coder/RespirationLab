<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellular Respiration Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#ffffff; --ink:#1b2430; --muted:#566271; --line:#b9c2ce; --tool:#edf0f4;
  --accent:#1f5f9e; --accent-ink:#ffffff; --header:#25405c; --header-ink:#ffffff;
  --good:#17692f; --good-bg:#e4f3e8; --bad:#9c2323; --bad-bg:#fbe9e9; --note-bg:#fff4d6;
  --meter-bg:#dfe5ec; --sel:#d7e7f8; --focus:#d46a00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181d; --ink:#e8edf2; --muted:#a3afbd; --line:#3c4856; --tool:#1d242c;
    --accent:#6fb1ee; --accent-ink:#0c1622; --header:#0e2236; --header-ink:#f0f5fa;
    --good:#7fd69a; --good-bg:#17301f; --bad:#ff9d9d; --bad-bg:#3a1c1c; --note-bg:#3a3217;
    --meter-bg:#2b3541; --sel:#21405f; --focus:#ffb44d;
  }
  body[data-tint]{--paper:color-mix(in srgb,var(--tint) 14%,#14181d)}
}
:root[data-theme="dark"]{
  --paper:#14181d; --ink:#e8edf2; --muted:#a3afbd; --line:#3c4856; --tool:#1d242c;
  --accent:#6fb1ee; --accent-ink:#0c1622; --header:#0e2236; --header-ink:#f0f5fa;
  --good:#7fd69a; --good-bg:#17301f; --bad:#ff9d9d; --bad-bg:#3a1c1c; --note-bg:#3a3217;
  --meter-bg:#2b3541; --sel:#21405f; --focus:#ffb44d;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:var(--fs,1.125rem);line-height:var(--lh,1.55);letter-spacing:var(--ls,0);word-spacing:var(--ws,0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
body[data-tint]{--paper:var(--tint)}
body[data-tint="cream"]{--tint:#fbf3dc}
body[data-tint="mint"]{--tint:#e3f4e8}
body[data-tint="blue"]{--tint:#e1eefa}
body[data-tint="peach"]{--tint:#fde8dc}
body[data-font="lexend"]{--font:"Lexend",Verdana,Tahoma,sans-serif}
body[data-font="atkinson"]{--font:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif}
body[data-space="wide"]{--ls:.05em;--ws:.18em;--lh:1.85}
button,select{font:inherit;letter-spacing:inherit;word-spacing:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6em} h2{font-size:1.25em} h3{font-size:1.05em}
p{margin:.55em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + toolbar */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);color:var(--header-ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hdr .ttl{font-weight:700;font-size:1.05em}
.hdr .stp{font-size:1em}
.hdr .tmr{font-variant-numeric:tabular-nums;border:1px solid currentColor;border-radius:6px;padding:2px 10px;min-width:9.5em;text-align:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--tool);border-bottom:1px solid var(--line)}
.tools .grow{flex:1}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);font-weight:700}
.btn.small{min-height:36px;padding:4px 10px}

/* layout */
main{max-width:1200px;margin:0 auto;padding:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.panel{border:2px solid var(--line);border-radius:10px;padding:16px;background:var(--paper);min-width:0}
.panel>h2:first-child{margin-top:0}
.notice{background:var(--note-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.fb{border-radius:8px;padding:10px 12px;margin:10px 0;border:2px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.fb.no{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.reading{background:var(--sel);border-radius:6px;box-shadow:0 0 0 4px var(--sel)}
.spk{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:30px;height:30px;padding:0;margin-left:8px;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;cursor:pointer;flex:none}
.spk svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nospeech .spk,.nospeech .speechonly{display:none}

/* tables */
.tblwrap{overflow-x:auto;max-width:100%}
table.data{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95em}
table.data caption{text-align:left;font-weight:700;padding:4px 0}
table.data th,table.data td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.data th{background:var(--tool)}
table.data tr.new td{background:var(--sel)}
select.sel{border:2px solid var(--line);border-radius:6px;padding:6px;background:var(--paper);min-height:40px;max-width:100%}
tr.rowbad td{background:var(--bad-bg)}
tr.rowok td{background:var(--good-bg)}

/* meters */
.meters{display:grid;gap:8px;margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:.95em}
.meter .bar{height:16px;background:var(--meter-bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.meter .fill{height:100%;width:0;background:var(--accent)}
.meter.lac .fill{background:repeating-linear-gradient(45deg,var(--ink) 0 4px,var(--accent) 4px 8px)}
.prog{height:10px;background:var(--meter-bg);border-radius:6px;overflow:hidden;margin:8px 0}
.prog>div{height:100%;width:0;background:var(--accent)}
svg.scene{width:100%;height:auto;max-height:330px;display:block}
svg.scene text{fill:var(--ink);font-family:var(--font);font-size:12px}
svg.scene .ln{stroke:var(--ink);fill:none;stroke-width:2}
svg.scene .fillp{fill:var(--paper);stroke:var(--ink);stroke-width:2}
svg.scene .flow{stroke-dasharray:6 5;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){svg.scene .flow{animation:none}}

/* options (M-STEP style) */
.optrow{display:flex;align-items:center;margin:8px 0}
.opt{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--paper);
  border-radius:8px;padding:10px 12px;cursor:pointer;min-height:48px}
.opt .let{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.opt[aria-checked="true"]{background:var(--sel);border-color:var(--accent)}
.opt[aria-checked="true"] .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.mult .let{border-radius:6px}
.stem{font-weight:600}

/* model builder */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:8px}
.piece{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 14px;cursor:pointer;min-height:40px;font-weight:600}
.piece[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:12px 0}
.mbox{border:2px solid var(--ink);border-radius:10px;padding:8px}
.mbox h3{margin:0 0 6px;font-size:1em}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{border:2px dashed var(--line);border-radius:8px;min-height:44px;background:var(--paper);cursor:pointer;text-align:left;padding:6px 10px}
.slot.full{border-style:solid;border-color:var(--ink);font-weight:600}
.arrow{align-self:center;font-size:1.8em}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}}
.atp{margin:8px 0}
.atp .btn{margin:2px 4px 2px 0}
.modelcard{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:8px 0}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.modal{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;max-width:560px;width:100%;padding:18px}
.modal h2{margin-top:0}
.grp{margin:14px 0}
.grp>.gl{font-weight:700;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gcell{border:2px solid var(--line);border-radius:8px;padding:8px;text-align:center;background:var(--paper);cursor:pointer;min-height:64px}
.gcell[disabled]{opacity:.45;cursor:not-allowed}
.gcell.cur{border-color:var(--accent);background:var(--sel)}
#lfbar{position:fixed;left:0;right:0;height:2.6em;top:40%;pointer-events:none;z-index:40;display:none;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.22);background:transparent}
.hide{display:none!important}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bin{border:2px solid var(--ink);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
@media (max-width:560px){.bins{grid-template-columns:1fr}}
/* ===== color ===== */
:root{
  --p0:#25405c;--p0bg:#e3eaf2;
  --p1:#0b6fb8;--p1bg:#dcecf9;
  --p2:#c2410c;--p2bg:#fde6d6;
  --p3:#6d3fc0;--p3bg:#ece4fa;
  --p4:#0f7b4f;--p4bg:#d9f1e6;
  --m-o:#1f78c8;--m-l:#c2410c;--m-a:#2e9e5b;
  --c-glu:#fff0c2;--c-glu-b:#946200;
  --c-o2:#0b6fb8;--c-o2-bg:#dcefff;
  --c-co2-bg:#e6e6f0;--c-co2-b:#4a4a6a;
  --c-h2o-bg:#d6f3f3;--c-h2o-b:#0b7a7a;
  --c-la:#b8420a;--c-la-bg:#ffe1cc;
  --c-et-bg:#eadcff;--c-et-b:#5a2fb0;
  --c-vessel:#f6cfcf;--c-cell:#fde9d8;--c-mito:#f8cfae;--c-liq:#fbe7a6;--c-bal:#f6b8c4;--c-atp:#cdeed7;
  --pc:var(--p0);--pc-bg:var(--p0bg);--pc-ink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --p0:#8fb2d6;--p0bg:#1c2a3a;--p1:#6bb8f2;--p1bg:#14293a;--p2:#ff9d6b;--p2bg:#3a2316;--p3:#bba0ff;--p3bg:#2a2145;--p4:#63d6a2;--p4bg:#15332a;
    --pc-ink:#0c1622;--m-o:#5db4f0;--m-l:#ff9a62;--m-a:#5fd4a0;
    --c-glu:#3d3210;--c-glu-b:#f0c24a;--c-o2:#6bb8f2;--c-o2-bg:#123a5a;--c-co2-bg:#2d2d44;--c-co2-b:#b5b5d8;--c-h2o-bg:#0f3b3b;--c-h2o-b:#5fd0d0;
    --c-la:#ff9d6b;--c-la-bg:#4a2310;--c-et-bg:#2f2150;--c-et-b:#b99bff;
    --c-vessel:#4a2323;--c-cell:#3a2a1f;--c-mito:#5a3320;--c-liq:#4a3f14;--c-bal:#5a2a38;--c-atp:#1f4a30;
  }
  :root:not([data-theme="light"]) body{--header:#0e2236}
}
:root[data-theme="dark"]{
  --p0:#8fb2d6;--p0bg:#1c2a3a;--p1:#6bb8f2;--p1bg:#14293a;--p2:#ff9d6b;--p2bg:#3a2316;--p3:#bba0ff;--p3bg:#2a2145;--p4:#63d6a2;--p4bg:#15332a;
  --pc-ink:#0c1622;--m-o:#5db4f0;--m-l:#ff9a62;--m-a:#5fd4a0;
  --c-glu:#3d3210;--c-glu-b:#f0c24a;--c-o2:#6bb8f2;--c-o2-bg:#123a5a;--c-co2-bg:#2d2d44;--c-co2-b:#b5b5d8;--c-h2o-bg:#0f3b3b;--c-h2o-b:#5fd0d0;
  --c-la:#ff9d6b;--c-la-bg:#4a2310;--c-et-bg:#2f2150;--c-et-b:#b99bff;
  --c-vessel:#4a2323;--c-cell:#3a2a1f;--c-mito:#5a3320;--c-liq:#4a3f14;--c-bal:#5a2a38;--c-atp:#1f4a30;
}
:root[data-theme="dark"] body{--header:#0e2236}
body{--accent:var(--pc);--accent-ink:var(--pc-ink);--sel:var(--pc-bg);--header:var(--pc)}
body[data-part="1"]{--pc:var(--p1);--pc-bg:var(--p1bg)}
body[data-part="2"]{--pc:var(--p2);--pc-bg:var(--p2bg)}
body[data-part="3"]{--pc:var(--p3);--pc-bg:var(--p3bg)}
body[data-part="4"]{--pc:var(--p4);--pc-bg:var(--p4bg)}
.tools{border-bottom:4px solid var(--pc)}
.panel{border-top:8px solid var(--pc)}
#stimPanel{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--pc) 7%,transparent)}
h1{border-bottom:4px solid var(--pc);padding-bottom:6px}
.partpill{display:inline-block;background:var(--pc);color:var(--pc-ink);padding:2px 14px;border-radius:999px;font-weight:700}
table.data th{background:var(--pc-bg)}
table.data caption{border-left:6px solid var(--pc);padding-left:8px}
.meters .meter:nth-child(1) .fill{background:var(--m-o)}
.meters .meter:nth-child(3) .fill{background:var(--m-a)}
.meter.lac .fill{background:repeating-linear-gradient(45deg,var(--m-l) 0 6px,color-mix(in srgb,var(--m-l) 55%,#fff) 6px 12px)}
.meter{border-color:var(--pc)}
.mbox{border-color:var(--pc)} .mbox h3{border-bottom:3px solid var(--pc);padding-bottom:4px}
.bin{border-color:var(--pc)}
.piece[data-sub],.slot.full[data-sub]{color:var(--ink)}
[data-sub="Glucose"]:is(.piece,.slot.full){background:var(--c-glu);border-color:var(--c-glu-b)}
[data-sub="Oxygen"]:is(.piece,.slot.full){background:var(--c-o2-bg);border-color:var(--c-o2)}
[data-sub="Carbon dioxide"]:is(.piece,.slot.full){background:var(--c-co2-bg);border-color:var(--c-co2-b)}
[data-sub="Water"]:is(.piece,.slot.full){background:var(--c-h2o-bg);border-color:var(--c-h2o-b)}
[data-sub="Lactic acid"]:is(.piece,.slot.full){background:var(--c-la-bg);border-color:var(--c-la)}
[data-sub="Ethanol"]:is(.piece,.slot.full){background:var(--c-et-bg);border-color:var(--c-et-b)}
.piece[data-sub][aria-pressed="true"]{background:var(--pc);color:var(--pc-ink);border-color:var(--pc)}
[data-path="aer"]{--pp:var(--p1);--ppbg:var(--p1bg)}
[data-path="lac"]{--pp:var(--p2);--ppbg:var(--p2bg)}
[data-path="alc"]{--pp:var(--p3);--ppbg:var(--p3bg)}
.piece[data-path],.slot.full[data-path]{background:var(--ppbg);border-color:var(--pp);color:var(--ink)}
.piece[data-path][aria-pressed="true"]{background:var(--pp);color:var(--pc-ink)}
.modelcard{border-left:10px solid var(--pc)}
.modelcard[data-path]{border-left-color:var(--pp)}
table.data th[data-path]{background:var(--ppbg);border-left:8px solid var(--pp)}
.plist{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.plist li{border-left:10px solid;border-radius:8px;padding:8px 12px}
.gcell[data-part="1"]{border-top:6px solid var(--p1)}
.gcell[data-part="2"]{border-top:6px solid var(--p2)}
.gcell[data-part="3"]{border-top:6px solid var(--p3)}
.gcell[data-part="4"]{border-top:6px solid var(--p4)}
svg.scene .vessel{fill:var(--c-vessel)}
svg.scene .cellbody{fill:var(--c-cell)}
svg.scene .mito{fill:var(--c-mito)}
svg.scene .atptag{fill:var(--c-atp)}
svg.scene .liq{fill:var(--c-liq);stroke:none}
svg.scene .bal{fill:var(--c-bal)}
svg.scene #aO2 .ln{stroke:var(--c-o2)}
svg.scene #aGlu .ln{stroke:var(--c-glu-b)}
svg.scene #aCO2 .ln{stroke:var(--c-co2-b)}
</style>
</head>
<body>
<header class="hdr" role="banner">
  <div class="ttl">Cellular Respiration Lab</div>
  <div class="stp" id="stepLbl" aria-live="polite">Directions</div>
</header>
<div class="tools" role="toolbar" aria-label="Lab tools">
  <button class="btn" id="bBack" type="button">&larr; Back</button>
  <button class="btn" id="bSteps" type="button">Steps</button>
  <button class="btn" id="bFlag" type="button" aria-pressed="false">&#9873; Flag</button>
  <button class="btn" id="bHelp" type="button">Help</button>
  <button class="btn" id="bOpts" type="button">Reading Options</button>
  <button class="btn speechonly" id="bRead" type="button">Read to me</button>
  <button class="btn speechonly hide" id="bPause" type="button">Pause</button>
  <button class="btn speechonly hide" id="bStop" type="button">Stop</button>
  <span class="grow"></span>
  <button class="btn primary" id="bNext" type="button">Next &rarr;</button>
</div>
<main id="main" tabindex="-1" aria-live="off"></main>
<div id="lfbar" aria-hidden="true"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
var FAST = !!window.__FASTSIM;           // test hook: runs simulations quickly
function ms(n){ return FAST ? Math.max(5, n/200) : n; }
function $(s,r){ return (r||document).querySelector(s); }
function el(tag,attrs,kids){
  var e=document.createElement(tag), k;
  if(attrs){ for(k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='text') e.textContent=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k]; else e.setAttribute(k,attrs[k]); } }
  (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
var SPK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function spk(){ var b=el('button',{class:'spk speechonly',type:'button','aria-label':'Read this aloud'}); b.innerHTML=SPK_SVG; return b; }
function rdP(text,cls){ var p=el('p',{class:'rd '+(cls||'')},[text]); p.appendChild(spk()); return p; }
function rdH(tag,text){ var h=el(tag,{class:'rd'},[text]); h.appendChild(spk()); return h; }

/* ================= state ================= */
var SECONDS=1800;
var S={ step:-2, furthest:0, done:{}, flags:{}, tries:{}, data:{}, models:{}, mc:{}, cmp:null, left:SECONDS, started:false, ended:false };
var timers=[];
function addTimer(t){ timers.push(t); return t; }
function clearTimers(){ timers.forEach(function(t){ clearInterval(t); clearTimeout(t); }); timers=[]; }
var OPT={ size:'normal', font:'standard', space:'normal', tint:'white', line:false, rate:'normal' };
try{ var saved=JSON.parse(localStorage.getItem('respLabOpts')||'null'); if(saved){ for(var k in saved){ if(k in OPT) OPT[k]=saved[k]; } } }catch(e){}
function saveOpts(){ try{ localStorage.setItem('respLabOpts',JSON.stringify(OPT)); }catch(e){} }
function applyOpts(){
  var b=document.body;
  b.style.setProperty('--fs',{normal:'1.125rem',large:'1.3rem',xlarge:'1.5rem'}[OPT.size]);
  if(OPT.font==='standard') b.removeAttribute('data-font'); else b.setAttribute('data-font',OPT.font);
  if(OPT.space==='normal') b.removeAttribute('data-space'); else b.setAttribute('data-space',OPT.space);

var synth=window.speechSynthesis, Q=[], qi=0, speaking=false, paused=false;
if(!synth||typeof SpeechSynthesisUtterance==='undefined'){ document.body.classList.add('nospeech'); synth=null; }
function sayText(n){ return n.getAttribute('data-say') || n.innerText || n.textContent || ''; }
function stopSpeak(){
  if(synth){ try{ synth.cancel(); }catch(e){} }
  Array.prototype.forEach.call(document.querySelectorAll('.reading'),function(x){ x.classList.remove('reading'); });
  Q=[]; qi=0; speaking=false; paused=false;
  $('#bStop').classList.add('hide'); $('#bPause').classList.add('hide'); $('#bPause').textContent='Pause';
}
function nextSpeak(){
  if(qi>=Q.length){ stopSpeak(); return; }
  var n=Q[qi]; n.classList.add('reading');
  var u=new SpeechSynthesisUtterance(sayText(n));
  u.rate=({slow:0.8,normal:1,fast:1.2})[OPT.rate]||1;
  u.lang='en-US';
  var adv=function(){ n.classList.remove('reading'); qi++; nextSpeak(); };
  u.onend=adv; u.onerror=adv;
  synth.speak(u);
}
function speakList(nodes){
  nodes=nodes.filter(function(n){ return sayText(n).trim().length>0; });
  if(!synth||!nodes.length) return;
  stopSpeak(); Q=nodes; qi=0; speaking=true;
  $('#bStop').classList.remove('hide'); $('#bPause').classList.remove('hide');
  nextSpeak();
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.spk'); if(!b) return;
  var host=b.closest('.rd'); if(host) speakList([host]);
});
$('#bRead').addEventListener('click',function(){
  speakList(Array.prototype.slice.call(document.querySelectorAll('#main .rd')));
});

$('#bPause').addEventListener('click',function(){
  if(!synth) return;
  if(paused){ synth.resume(); paused=false; this.textContent='Pause'; }
  else { synth.pause(); paused=true; this.textContent='Resume'; }
});

/* ================= model builder ================= */
var PIECES=['Glucose','Oxygen','Carbon dioxide','Water','Lactic acid','Ethanol'];
function sameSet(a,b){ return a.length===b.length && a.slice().sort().join('|')===b.slice().sort().join('|'); }
function modelBuilder(host,cfg,stepIdx){
  var M=S.models[cfg.id];
  if(!M){
    M={ in:[], out:[], atp:null, ok:false, hint:0, fails:0 };
    for(var i=0;i<cfg.inSlots;i++) M.in.push((cfg.preload&&cfg.preload.in[i])||null);
    for(var j=0;j<cfg.outSlots;j++) M.out.push((cfg.preload&&cfg.preload.out[j])||null);
    if(cfg.preload) M.atp=cfg.preload.atp;
    S.models[cfg.id]=M;
  }
  var selPiece=null;
  var root=el('div'); host.appendChild(root);
  function draw(){
    clear(root);
    root.appendChild(rdP(cfg.prompt));
    var placed=M.in.concat(M.out).filter(Boolean);
    var pool=el('div',{class:'pool',role:'group','aria-label':'Pieces'});
    PIECES.forEach(function(p){
      if(placed.indexOf(p)>=0) return;
      var b=el('button',{class:'piece',type:'button','data-sub':p,'aria-pressed':selPiece===p?'true':'false'},[p]);
      b.addEventListener('click',function(){ if(M.ok) return; selPiece=(selPiece===p?null:p); draw(); });
      pool.appendChild(b);
    });
    if(!pool.firstChild) pool.appendChild(el('span',{class:'rd',text:'All pieces are placed.'}));
    root.appendChild(el('div',{class:'rd','data-say':'Pieces you can use.'},[el('strong',{text:'Pieces'})]));
    root.appendChild(pool);
    root.appendChild(el('p',{text:'Tap a piece, then tap a box. Tap a filled box to take the piece back.'}));
    function box(title,arr,key){
      var sl=el('div',{class:'slots'});
      arr.forEach(function(v,i){
        var b=el('button',{class:'slot'+(v?' full':''),type:'button','data-sub':v||'','aria-label':title+' box '+(i+1)+(v?': '+v:': empty')},[v||'(empty)']);
        b.addEventListener('click',function(){
          if(M.ok) return;
          if(v){ arr[i]=null; M.fb=null; }
          else if(selPiece){ arr[i]=selPiece; selPiece=null; M.fb=null; }
          draw();
        });
        sl.appendChild(b);
      });
      return el('div',{class:'mbox'},[el('h3',{text:title}),sl]);
    }
    root.appendChild(el('div',{class:'mrow'},[box('Goes IN',M.in,'in'),el('div',{class:'arrow','aria-hidden':'true',text:'\u2192'}),box('Comes OUT',M.out,'out')]));
    var atpWrap=el('div',{class:'atp',role:'group','aria-label':'ATP made'},[el('strong',{text:'ATP (energy) made: '})]);
    ['About 36','About 2','None'].forEach(function(v){
      var b=el('button',{class:'btn small',type:'button','aria-pressed':M.atp===v?'true':'false'},[v]);
      b.addEventListener('click',function(){ if(M.ok) return; M.atp=v; M.fb=null; draw(); });
      atpWrap.appendChild(b);
    });
    root.appendChild(atpWrap);
    var bCheck=el('button',{class:'btn primary',type:'button'},['Check my model']);
    var bHint=el('button',{class:'btn',type:'button'},['Hint']);
    var bReset=el('button',{class:'btn',type:'button'},['Start over']);
    if(M.ok){ bCheck.disabled=true; bHint.disabled=true; bReset.disabled=true; }
    bCheck.addEventListener('click',check); bHint.addEventListener('click',hint);
    bReset.addEventListener('click',function(){
      for(var i=0;i<M.in.length;i++) M.in[i]=(cfg.preload&&cfg.preload.in[i])||null;
      for(var j=0;j<M.out.length;j++) M.out[j]=(cfg.preload&&cfg.preload.out[j])||null;
      M.atp=cfg.preload?cfg.preload.atp:null; M.fb=null; selPiece=null; draw();
    });
    root.appendChild(el('div',{class:'row grp'},[bCheck,bHint,bReset]));
    var fbBox=el('div',{'aria-live':'polite'}); root.appendChild(fbBox);
    if(M.ok) fbBox.appendChild(el('div',{class:'fb ok'},['\u2713 Model complete. '+cfg.why]));
    else if(M.fb) fbBox.appendChild(el('div',{class:'fb '+(M.fb.kind||'no')},[M.fb.text]));
  }
  function score(){
    var right=0, total=cfg.ans.in.length+cfg.ans.out.length+1, wrongIn=[], wrongOut=[], missing=[];
    M.in.forEach(function(p){ if(!p) return; if(cfg.ans.in.indexOf(p)>=0) right++; else wrongIn.push(p); });
    M.out.forEach(function(p){ if(!p) return; if(cfg.ans.out.indexOf(p)>=0) right++; else wrongOut.push(p); });
    if(M.atp===cfg.ans.atp) right++;
    cfg.ans.in.forEach(function(p){ if(M.in.indexOf(p)<0) missing.push({side:'in',p:p}); });
    cfg.ans.out.forEach(function(p){ if(M.out.indexOf(p)<0) missing.push({side:'out',p:p}); });
    return {right:right,total:total,wrongIn:wrongIn,wrongOut:wrongOut,missing:missing};
  }
  function check(){
    var sc=score();
    var ok=sameSet(M.in.filter(Boolean),cfg.ans.in)&&sameSet(M.out.filter(Boolean),cfg.ans.out)&&M.atp===cfg.ans.atp;
    S.tries[cfg.id]=(S.tries[cfg.id]||0)+1;
    if(ok){ M.ok=true; M.fb=null; S.done[stepIdx]=true; refreshNav(); }
    else { M.fails++; M.fb={kind:'no',text:'Not yet. '+sc.right+' of '+sc.total+' parts are right. Look at the data table again, then change your model.'}; }
    draw();
  }
  function hint(){
    var sc=score(); M.hint++;
    var txt;
    if(M.hint===1) txt=cfg.hints[0];
    else if(M.hint===2){
      if(sc.wrongIn.length) txt='One piece in the IN box does not belong. Check it against the table.';
      else if(sc.wrongOut.length) txt='One piece in the OUT box does not belong. Check it against the table.';
      else if(M.atp!==cfg.ans.atp) txt='Look at the ATP row in the table. Which amount matches?';
      else txt='A piece is missing. Look for a row in the table with a number above 0.';
    } else {
      if(sc.wrongIn.length){ var w=sc.wrongIn[0]; M.in[M.in.indexOf(w)]=null; txt='I took '+w+' out of the IN box for you. Try again.'; }
      else if(sc.wrongOut.length){ var w2=sc.wrongOut[0]; M.out[M.out.indexOf(w2)]=null; txt='I took '+w2+' out of the OUT box for you. Try again.'; }
      else if(M.atp!==cfg.ans.atp){ M.atp=cfg.ans.atp; txt='I set the ATP amount for you. Now check the pieces.'; }
      else if(sc.missing.length){ var m=sc.missing[0], arr=(m.side==='in'?M.in:M.out), at=arr.indexOf(null); if(at>=0){ arr[at]=m.p; txt='I placed '+m.p+' for you. Check your model.'; } else txt='Check the boxes again.'; }
      else txt='Press Check my model.';
    }
    M.fb={kind:'ok',text:'Hint: '+txt}; draw();
  }
  draw();
}

  });
  openModal('Steps',el('div',null,[el('p',{text:'Tap a step to go to it. You can only open steps you have reached.'}),g]));
});
$('#bHelp').addEventListener('click',function(){
  var s=S.step, t;
  if(s===-2) t='Read the directions, then press Begin the lab.';
  else if(s>=STEPS.length) t='You are finished. Press Back to review any step.';
  else t=STEPS[s].help;
  var body=el('div',null,[el('p',{class:'rd'},[t,spk()])]);
  openModal('Help',body);
});
function optGroup(label,key,choices){
  var row=el('div',{class:'row'});
  choices.forEach(function(c){
    var b=el('button',{class:'btn small',type:'button','aria-pressed':OPT[key]===c[0]?'true':'false'},[c[1]]);
    b.addEventListener('click',function(){
      OPT[key]=c[0]; saveOpts(); applyOpts();
      Array.prototype.forEach.call(row.children,function(x,i){ x.setAttribute('aria-pressed',choices[i][0]===OPT[key]?'true':'false'); });
    });
    row.appendChild(b);
  });
  return el('div',{class:'grp'},[el('div',{class:'gl',text:label}),row]);
}
$('#bOpts').addEventListener('click',function(){
  var body=el('div');
  body.appendChild(optGroup('Text size','size',[['normal','Regular'],['large','Large'],['xlarge','Extra large']]));
  body.appendChild(optGroup('Font','font',[['standard','Standard'],['lexend','Easy-read A'],['atkinson','Easy-read B']]));
  body.appendChild(optGroup('Spacing','space',[['normal','Regular'],['wide','Wide']]));
  body.appendChild(optGroup('Page color','tint',[['white','White'],['cream','Cream'],['mint','Mint'],['blue','Blue'],['peach','Peach']]));
  body.appendChild(optGroup('Reading line','line',[[false,'Off'],[true,'On']]));
  var sp=optGroup('Read to me speed','rate',[['slow','Slow'],['normal','Regular'],['fast','Fast']]);
  sp.classList.add('speechonly'); body.appendChild(sp);
  openModal('Reading Options',body);
});
document.addEventListener('mousemove',function(e){ if(OPT.line) $('#lfbar').style.top=(e.clientY-20)+'px'; });
document.addEventListener('touchmove',function(e){ if(OPT.line&&e.touches[0]) $('#lfbar').style.top=(e.touches[0].clientY-20)+'px'; },{passive:true});

applyOpts(); render();
})();
</script>
</body>
</html>
